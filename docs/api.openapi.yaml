openapi: 3.1.0
info:
  title: Cirra prototype relay
  version: 0.1.0
  description: |
    Client-encrypted relay with Cognito account access tokens and independently
    approved device credentials. Operators grant immutable issuer/subject membership.
    Login cannot decrypt messages or join MLS groups. Enterprise federation, general
    streaming video, push, and billing remain future work. Object media uses client encryption and short-lived S3 grants.
security:
  - deviceBearer: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200':
          description: Process health and supported protocol version; not a storage readiness check.
  /v1/conversations:
    post:
      summary: Create the initial relay device allowlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversation' }
      responses:
        '201':
          description: Created, or matching idempotent creation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid JSON shape or types }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/conversations/{id}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      summary: Read the current roster as an active conversation member
      responses:
        '200':
          description: Current relay metadata; clients still require verified identity pins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/conversations/{id}/admissions:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    post:
      summary: Atomically admit one enrolled device with owner commit and addressed welcome
      description: Owner only. Maximum body 128 KiB; combined decoded commit/welcome is at most 64 KiB. Expected roster is checked atomically. Existing applications keep the ordinary event limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAdmission' }
      responses:
        '200':
          description: Saved roster and event pair, or identical request retry
          content:
            application/json:
              schema:
                type: object
                required: [commit_sequence, welcome_sequence, duplicate]
                properties:
                  commit_sequence: { type: integer, minimum: 1 }
                  welcome_sequence: { type: integer, minimum: 1 }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/conversations/{id}/lifecycle:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    post:
      summary: Atomically transfer group ownership or remove one device with an owner-authenticated MLS commit
      description: Maximum body 128 KiB with a 64 KiB decoded commit. Requires the active current owner and exact previous roster. Transfer targets must be active current members. Removal rotates MLS keys and removes relay access in the same transaction. Matching retries retain the original result after ownership changes; clients persist and resend the exact commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupLifecycle' }
      responses:
        '200':
          description: Saved transition or identical request retry
          content:
            application/json:
              schema:
                type: object
                required: [sequence, duplicate]
                properties:
                  sequence: { type: integer, minimum: 1 }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/conversations/{id}/events:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    post:
      summary: Durably append client-encrypted MLS bytes
      description: |
        Repeat the same message ID and exact envelope after an ambiguous response.
        Reusing a sender/message ID with different content returns 409.
        Only the owner may submit welcome/commit events. The relay does not parse
        or authenticate MLS content; receiving clients must validate it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitEvent' }
      responses:
        '200':
          description: Accepted or already accepted
          content:
            application/json:
              schema:
                type: object
                required: [sequence, duplicate]
                properties:
                  sequence: { type: integer, minimum: 1 }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Body exceeds 96 KiB }
        '422': { description: Invalid JSON shape or types }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/conversations/{id}/sync:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      summary: Fetch a page of visible encrypted events
      description: |
        Continue with next_cursor while has_more is true, even for empty visible
        pages. Own events and welcomes addressed to another device are skipped.
        Cursors are scoped to this tenant and conversation, and may contain gaps.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 32, default: 32 }
      responses:
        '200':
          description: Encrypted event page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor, has_more]
                properties:
                  events:
                    type: array
                    maxItems: 32
                    items: { $ref: '#/components/schemas/StoredEvent' }
                  next_cursor: { type: integer, minimum: 0 }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/devices/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Revoke one's own credential, or an organization's device as admin
      description: |
        Revokes relay access only. Group owners must separately rotate MLS keys
        and clients must approve/apply the removal before sending new content.
      responses:
        '204': { description: Credential revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/login/config:
    get:
      security: []
      summary: Public Cognito issuer, client ID, domain, and scopes
      responses:
        '200': { description: Public configuration; no client secret }
  /v1/account:
    get:
      security: [{ accountBearer: [] }]
      summary: Read the explicitly granted account and its public device/request state
      responses:
        '200': { description: Granted account; excludes credentials, digests, and proofs }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/account/enrollments:
    post:
      security: [{ accountBearer: [] }]
      summary: Submit a signed public replacement-device identity (8 KiB body limit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentInput' }
      responses:
        '202': { description: Pending request or identical retry; expires after ten minutes }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/enrollments/{account}:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
    get:
      summary: Inspect enrollment as an active device of this account or same-tenant administrator
      responses:
        '200': { description: Public account and enrollment state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/enrollments/{account}/{id}/decision:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve/reject after full fingerprint comparison; credential activation is atomic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, approve]
              properties:
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                approve: { type: boolean }
      responses:
        '204': { description: Decision saved; identical repeated decisions are safe }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/enrollments/{account}/devices/{device}/revoke:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      - { name: device, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Revoke a device owned by this account; MLS removal/key rotation remain separate
      responses:
        '204': { description: Credential revoked; no old content is erased }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/conversations/{conversation}/objects/uploads:
    parameters:
      - { name: conversation, in: path, required: true, schema: {type: string, format: uuid} }
    post:
      summary: Reserve an immutable ciphertext object and request an upload grant
      description: |
        Current active device and conversation membership required. Body maximum 4096 bytes.
        Relay accepts no filename, MIME type or key. Same object ID and exact metadata retry
        is idempotent for the original uploader. Ciphertext maximum is 26214454 bytes (25 MiB
        plus version header, nonce and authentication tag). Daily reservations are bounded
        to 250 MiB per device and 1 GiB per tenant. Object access expires after 30 days.
        S3 PUT grants expire in 60 seconds and sign exact size/checksum/create-only headers.
        Upload bytes directly to the grant URL; do not send bytes through API Gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectUpload' }
      responses:
        '200':
          description: Existing immutable object or short-lived upload grant; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrant' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/conversations/{conversation}/objects/{object}:
    parameters:
      - { name: conversation, in: path, required: true, schema: {type: string, format: uuid} }
      - { name: object, in: path, required: true, schema: {type: string, format: uuid} }
    get:
      summary: Authorize a ciphertext download and issue a 60-second transfer grant
      description: |
        Membership and revocation are checked for every grant. Previously issued S3 URLs
        remain usable until expiration. Native clients verify ciphertext length/hash and
        AEAD before exposing plaintext. Raw keys/descriptors only travel inside MLS.
      responses:
        '200':
          description: Short-lived ciphertext transfer grant; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    accountBearer:
      type: http
      scheme: bearer
      bearerFormat: Cognito access JWT (RS256, croaker/access)
    deviceBearer:
      type: http
      scheme: bearer
      description: Random 32-byte hexadecimal device token; use HTTPS remotely.
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    GroupLifecycle:
      type: object
      additionalProperties: false
      required: [context, commit]
      properties:
        context:
          type: object
          additionalProperties: false
          required: [conversation_id, request_id, expected_owner, expected_devices, action]
          properties:
            conversation_id: { type: string, format: uuid }
            request_id: { type: string, format: uuid }
            expected_owner: { type: string, format: uuid }
            expected_devices:
              type: array
              minItems: 2
              maxItems: 500
              uniqueItems: true
              items: { type: string, format: uuid }
            action:
              type: object
              additionalProperties: false
              required: [kind, target]
              properties:
                kind: { type: string, enum: [transfer, remove] }
                target: { type: string, format: uuid }
        commit: { $ref: '#/components/schemas/SubmitEvent' }

    ObjectUpload:
      type: object
      additionalProperties: false
      required: [object_id, ciphertext_size, sha256]
      properties:
        object_id: {type: string, format: uuid}
        ciphertext_size: {type: integer, minimum: 54, maximum: 26214454}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    MediaTransfer:
      type: object
      required: [url, headers, expires_at, requires_device_auth]
      properties:
        url: {type: string, format: uri}
        headers: {type: object, additionalProperties: {type: string}}
        expires_at: {type: integer, minimum: 0}
        requires_device_auth:
          type: boolean
          description: |
            False for S3; never attach relay credentials to that URL. True only for local
            relay content routes, which require current device auth on every request.
            Validate destination against the configured relay/S3 origin; never follow redirects.
    UploadGrant:
      type: object
      required: [transfer, already_uploaded]
      properties:
        transfer:
          oneOf:
            - {$ref: '#/components/schemas/MediaTransfer'}
            - {type: 'null'}
        already_uploaded: {type: boolean}
    GroupAdmission:
      type: object
      additionalProperties: false
      required: [request_id, expected_devices, added_device, commit, welcome]
      properties:
        request_id: { type: string, format: uuid }
        expected_devices:
          type: array
          minItems: 1
          maxItems: 499
          uniqueItems: true
          items: { type: string, format: uuid }
        added_device: { type: string, format: uuid }
        commit:
          description: Commit event with no recipient; exact ciphertext saved by the owner before transport.
          $ref: '#/components/schemas/SubmitEvent'
        welcome:
          description: Welcome event addressed only to added_device, with a distinct event ID.
          $ref: '#/components/schemas/SubmitEvent'
    EnrollmentInput:
      type: object
      additionalProperties: false
      required: [id, binding, label, token_hash, proof]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        token_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        proof:
          description: Ed25519 signature over the versioned binary enrollment proof; see ADR-0010.
          type: array
          minItems: 64
          maxItems: 64
          items: { type: integer, minimum: 0, maximum: 255 }
        binding:
          type: object
          additionalProperties: false
          required: [tenant_id, device_id, signature_key]
          properties:
            tenant_id: { type: string, format: uuid }
            device_id: { type: string, format: uuid }
            signature_key:
              type: array
              minItems: 32
              maxItems: 32
              items: { type: integer, minimum: 0, maximum: 255 }
    CreateConversation:
      type: object
      additionalProperties: false
      required: [id, devices]
      properties:
        id: { type: string, format: uuid }
        devices:
          type: array
          minItems: 2
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    Conversation:
      type: object
      required: [id, tenant_id, owner, devices]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner: { type: string, format: uuid }
        devices:
          type: array
          items: { type: string, format: uuid }
    SubmitEvent:
      type: object
      additionalProperties: false
      required: [protocol_version, message_id, kind, ciphertext]
      properties:
        protocol_version: { type: integer, const: 1 }
        message_id: { type: string, format: uuid }
        kind: { type: string, enum: [welcome, commit, application] }
        recipient:
          type: [string, 'null']
          format: uuid
          description: Required and non-null only for welcome events; absent/null otherwise.
        ciphertext:
          type: string
          contentEncoding: base64
          maxLength: 87384
          description: Nonempty MLS bytes, at most 65536 bytes before base64 encoding.
    StoredEvent:
      type: object
      required: [sequence, sender, submitted_at, expires_at, protocol_version, message_id, kind, ciphertext]
      properties:
        sequence: { type: integer, minimum: 1 }
        sender: { type: string, format: uuid, description: Relay routing identity; independently verify the MLS sender. }
        submitted_at: { type: integer, minimum: 0, description: Unix seconds }
        expires_at: { type: integer, minimum: 0, description: Unix seconds }
        protocol_version: { type: integer, const: 1 }
        message_id: { type: string, format: uuid }
        kind: { type: string, enum: [welcome, commit, application] }
        recipient: { type: [string, 'null'], format: uuid }
        ciphertext: { type: string, contentEncoding: base64 }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Invalid request or unsupported protocol version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing, unknown, malformed, or revoked credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource absent or caller not authorized to access it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Identifier reused with conflicting data, or concurrent write contention; retry the saved envelope with backoff
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unavailable:
      description: Storage unavailable; retry the saved envelope with backoff
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
