[workspace]
members = ["crates/protocol", "crates/crypto", "crates/client", "crates/relay", "crates/cli", "crates/local", "crates/device", "apps/desktop", "crates/ios-bridge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
croaker-protocol = { path = "crates/protocol" }
croaker-crypto = { path = "crates/crypto" }
croaker-client = { path = "crates/client" }
croaker-relay = { path = "crates/relay" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
